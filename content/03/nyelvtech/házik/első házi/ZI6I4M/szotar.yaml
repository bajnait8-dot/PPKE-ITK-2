szotar:
  '@forras_nyelv': angol
  cimszo:
  - '@szo': pie
    '@fonetikusan': '[paɪ]'
    '@szofaj': noun
    forditas:
    - '@cel_nyelv': magyar
      '@szo': pite
      pelda:
      - '@forras': apple pie
        '@forditas': almás pite
      - '@forras': I love eating warm pie with ice cream.
        '@forditas': Szeretek meleg pitét enni fagylalttal.
    - '@cel_nyelv': dán
      '@szo': tærte
      pelda:
      - '@forras': Jeg bagte en tærte i går.
        '@forditas': Tegnap sütöttem egy pitét.
      - '@forras': Jeg elsker at spise varm tærte med is.
        '@forditas': Szeretek meleg pitét enni fagylalttal.
  - '@szo': oven
    '@fonetikusan': '[ˈʌv.ən]'
    '@szofaj': noun
    forditas:
    - '@cel_nyelv': magyar
      '@szo': sütő
      pelda:
      - '@forras': Put the cake in the oven.
        '@forditas': Tedd be a tortát a sütőbe.
      - '@forras': The oven is still hot.
        '@forditas': A sütő még mindig forró.
    - '@cel_nyelv': dán
      '@szo': ovn
      pelda:
      - '@forras': Kagen er i ovnen.
        '@forditas': A sütemény a sütőben van.
      - '@forras': Ovnen er stadig varm.
        '@forditas': A sütő még mindig forró.
  - '@szo': flour
    '@fonetikusan': '[ˈflaʊ.ər]'
    '@szofaj': noun
    forditas:
    - '@cel_nyelv': magyar
      '@szo': liszt
      pelda:
      - '@forras': Mix the flour with water.
        '@forditas': Keverd össze a lisztet vízzel.
      - '@forras': Sift the flour before baking.
        '@forditas': Szitáld át a lisztet sütés előtt.
    - '@cel_nyelv': dán
      '@szo': mel
      pelda:
      - '@forras': Bland melet med vand.
        '@forditas': Keverd össze a lisztet vízzel.
      - '@forras': Si melet, før du bager.
        '@forditas': Szitáld át a lisztet sütés előtt.
  - '@szo': sugar
    '@fonetikusan': '[ˈʃʊɡ.ər]'
    '@szofaj': noun
    forditas:
    - '@cel_nyelv': magyar
      '@szo': cukor
      pelda:
      - '@forras': Add more sugar to taste.
        '@forditas': Ízlés szerint adj hozzá még cukrot.
      - '@forras': Too much sugar is unhealthy.
        '@forditas': A túl sok cukor egészségtelen.
    - '@cel_nyelv': dán
      '@szo': sukker
      pelda:
      - '@forras': Tilsæt mere sukker efter smag.
        '@forditas': Ízlés szerint adj hozzá még cukrot.
      - '@forras': For meget sukker er usundt.
        '@forditas': A túl sok cukor egészségtelen.
  - '@szo': bake
    '@fonetikusan': '[beɪk]'
    '@szofaj': verb
    forditas:
    - '@cel_nyelv': magyar
      '@szo': süt
      pelda:
      - '@forras': I bake bread every weekend.
        '@forditas': Minden hétvégén kenyeret sütök.
      - '@forras': She loves to bake for her friends.
        '@forditas': Szeret a barátainak sütni.
    - '@cel_nyelv': dán
      '@szo': bage
      pelda:
      - '@forras': Jeg bager brød hver weekend.
        '@forditas': Minden hétvégén kenyeret sütök.
      - '@forras': Bagning får køkkenet til at dufte dejligt.
        '@forditas': A sütés csodás illatot áraszt a konyhában.
